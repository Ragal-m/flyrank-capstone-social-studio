run: docker compose up --build
seed: docker compose exec app python -m app.seed
test: python -m pytest -q
base_url: http://localhost:8000
endpoints:
  health: GET /health
  create_campaign: POST /campaigns
  campaign_status: GET /campaigns/{campaign_id}
  publish_now: POST /campaigns/{campaign_id}/publish
  delivery_webhook: POST /webhook/social-delivery
  fake_rate_limit: POST /fake/control/rate-limit/{platform}


